services:
  - type: web
    name: numlingo
    runtime: node
    plan: free
    autoDeployTrigger: checksPass
    region: ohio
    rootDir: server
    # Cached node_modules can keep a stale @colyseus/core copy.
    buildCommand: rm -rf node_modules && bun install --frozen-lockfile
    startCommand: bun run src/index.ts
    healthCheckPath: /hello_world
    envVars:
      - key: NODE_ENV
        value: production
