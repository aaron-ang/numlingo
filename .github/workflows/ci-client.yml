name: CI Client

on:
  # Every push to main runs this, even server-only changes: Vercel's
  # production Deployment Check waits for the "client" job on each commit.
  push:
    branches: [main]
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/ci-client.yml"

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
